[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-os"
version = "0.1.0"
description = "A Markdown second brain with agentic capture, auto-linking, and embeddings search."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "schuligan" }]
dependencies = ["pydantic>=2.6", "rich>=13.7", "pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools]
packages = ["brain"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
